{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Site settings</h1>
<form method="post" class="admin-card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="row g-3">
    {% for k in keys %}
    <div class="{{ 'col-12' if k in ('meta_description',) else 'col-md-6' }}">
      <label class="form-label" for="s-{{ k }}">{{ k.replace('_', ' ') | title }}{% if k == 'php_per_usd' %} (₱ per $1 for the USD switch){% endif %}</label>
      {% if k == 'meta_description' %}<textarea id="s-{{ k }}" name="{{ k }}" rows="3" class="form-control">{{ values[k] }}</textarea>
      {% else %}<input id="s-{{ k }}" name="{{ k }}" class="form-control" value="{{ values[k] }}">{% endif %}
    </div>
    {% endfor %}
  </div>
  <button class="btn btn-brand mt-4 px-4">Save settings</button>
</form>
{% endblock %}
