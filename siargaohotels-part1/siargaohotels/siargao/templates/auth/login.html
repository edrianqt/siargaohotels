{% extends "base.html" %}
{% block title %}Log In - {{ S.site_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container auth-wrap">
  <form method="post" class="form-card">
    <h1 class="h3 mb-4">Log In</h1>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label class="form-label" for="l-email">Email</label><input id="l-email" type="email" name="email" class="form-control mb-3" required autofocus>
    <label class="form-label" for="l-pw">Password</label><input id="l-pw" type="password" name="password" class="form-control mb-3" required>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
    <button class="btn btn-brand w-100 btn-lg">Log In</button>
    <p class="text-center mt-3 mb-0">Do not have an account? <a href="{{ url_for('auth.signup', next=request.args.get('next', '')) }}">Sign Up</a></p>
  </form>
</div></section>
{% endblock %}
